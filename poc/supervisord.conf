[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/app/logs/supervisord.pid

; ── openalgo Flask app (gunicorn + eventlet, port 5000) ──────────────────────
; Command matches openalgo-stream/start.sh gunicorn invocation
[program:openalgo]
; POC uses Flask dev server via run_openalgo.py — avoids:
;   1. gunicorn 25.x + eventlet "asyncio.run() in running loop" issue
;   2. Flask-SocketIO sys.stdin.isatty() check (supervisord has no tty)
; The wrapper monkey-patches SocketIO.run() to set allow_unsafe_werkzeug=True
; without modifying openalgo's app.py. For production, pin gunicorn<23 and
; replace this with: gunicorn --worker-class eventlet -w 1 app:app
command=/app/openalgo/.venv/bin/python /app/openalgo/poc/run_openalgo.py
directory=/app/openalgo
priority=10
autostart=true
autorestart=true
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/openalgo.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/app/logs/openalgo_err.log
stderr_logfile_maxbytes=20MB

; ── WebSocket proxy (port 8765) ───────────────────────────────────────────────
; Command matches openalgo-stream/start.sh WebSocket proxy invocation
; CRITICAL: WEBSOCKET_HOST=0.0.0.0 MUST be set in .env (default is 127.0.0.1)
; See: websocket_proxy/server.py os.getenv("WEBSOCKET_HOST","127.0.0.1")
[program:websocket-proxy]
command=/app/openalgo/.venv/bin/python -m websocket_proxy.server
directory=/app/openalgo
priority=10
autostart=true
autorestart=true
startretries=3
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/ws_proxy.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/app/logs/ws_proxy_err.log
stderr_logfile_maxbytes=20MB

; ── strategy-executor JVM (port 7012) ────────────────────────────────────────
; JVM flags match zenox-strategy-executor/Dockerfile CMD --add-opens pattern
; -Xmx1g: caps JVM heap (Python/scipy needs remaining memory)
; startsecs=30: allow DB connection pool to initialize before marking RUNNING
[program:strategy-executor]
command=java
    -Dquarkus.profile=poc
    -Xmx1g
    -Xms256m
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+ExitOnOutOfMemoryError
    -XX:+UseContainerSupport
    -Djava.security.egd=file:/dev/./urandom
    --add-opens java.base/jdk.internal.misc=ALL-UNNAMED
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED
    --add-opens java.base/java.nio=ALL-UNNAMED
    -jar /app/executor/app.jar
directory=/app/executor
priority=20
autostart=true
autorestart=true
startretries=3
startsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/executor.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/app/logs/executor_err.log
stderr_logfile_maxbytes=50MB
